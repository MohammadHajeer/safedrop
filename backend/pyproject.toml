[project]
name = "safedrop-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==25.1.0",
    "boto3==1.43.77",
    "botocore==1.43.77",
    "cryptography==50.0.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pwdlib==0.3.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "pytest==9.1.1",
    "ruff==0.16.4",
    "uvicorn[standard]==0.52.3",
]

[tool.uv]
default-groups = []

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --tb=short"
